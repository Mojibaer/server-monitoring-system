<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Monitoring System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Server Monitoring Dashboard</h1>

        <div class="server-selection">
            <label for="serverSelect">Choose Server:</label>
            <select id="serverSelect">
                <option value="">Select a server...</option>
            </select>
            <span id="serverIp" style="margin-left: 15px; color: #888;"></span>
        </div>

        <div class="charts-container">
            <div class="chart-box">
                <canvas id="cpuChart"></canvas>
            </div>
            <div class="chart-box">
                <canvas id="ramChart"></canvas>
            </div>
        </div>

        <div class="status-container">
            <div id="diskUsage"
                style="text-align: center; margin-top: 20px; font-size: 1.2rem; font-weight: bold; color: #ff9800;">
                Disk Usage: Selecting...
            </div>
            <div id="serverStatus" class="status ok">
                STATUS: OK
            </div>
        </div>




    </div>

    <script src="script.js"></script>
</body>

</html>
