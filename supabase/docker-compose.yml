name: server-monitoring

services:

  # ─────────────────────────────────────────────
  # PostgreSQL — Supabase-flavoured Postgres 15
  # ─────────────────────────────────────────────
  db:
    container_name: supabase-db
    image: supabase/postgres:15.8.1.085
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      # Monitoring schema — runs once on a fresh data volume, after roles/jwt.
      - ./volumes/db/schema.sql:/docker-entrypoint-initdb.d/zzz-schema.sql:Z
      - db_data:/var/lib/postgresql/data
      - db_config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${POSTGRES_PORT:-5432}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    command:
      [
        "postgres",
        "-c", "config_file=/etc/postgresql/postgresql.conf",
        "-c", "log_min_messages=fatal"
      ]

  # ─────────────────────────────────────────────
  # PostgREST — auto REST API from your DB schema
  # ─────────────────────────────────────────────
  rest:
    container_name: supabase-rest
    image: postgrest/postgrest:v14.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-db}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}

  # ─────────────────────────────────────────────
  # Kong — API gateway (routes /rest/v1 → PostgREST, key-auth)
  # ─────────────────────────────────────────────
  kong:
    container_name: supabase-kong
    image: kong/kong:3.9.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${KONG_HTTP_PORT:-8000}:8000"
      - "${KONG_HTTPS_PORT:-8443}:8443"
    volumes:
      - ./volumes/api/kong.yml:/home/kong/temp.yml:ro
      - ./volumes/api/kong-entrypoint.sh:/home/kong/kong-entrypoint.sh:ro
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-supabase}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-supabase}
    entrypoint: ["/bin/sh", "/home/kong/kong-entrypoint.sh"]

  # ─────────────────────────────────────────────
  # Node monitoring backend — gRPC (agents) + SSE (dashboard)
  # ─────────────────────────────────────────────
  backend:
    container_name: monitoring-backend
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      kong:
        condition: service_healthy
    ports:
      - "8081:8081"   # SSE / dashboard
    environment:
      # Backend talks to Supabase through Kong inside the compose network.
      SUPABASE_PUBLIC_URL: http://kong:8000
      SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}

  # ─────────────────────────────────────────────
  # Client agents — same image, individual identity & limits.
  # gRPC → backend:50051 (internal). Each container gets its own IP.
  # ─────────────────────────────────────────────
  agent-web-01:
    container_name: agent-web-01
    build:
      context: ../ClientAgent
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: backend:50051
      AGENT_HOSTNAME: web-server-01
    mem_limit: 512m
    cpus: 0.5

  agent-db-02:
    container_name: agent-db-02
    build:
      context: ../ClientAgent
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: backend:50051
      AGENT_HOSTNAME: db-server-02
    mem_limit: 1g
    cpus: 1.0

  agent-edge-03:
    container_name: agent-edge-03
    build:
      context: ../ClientAgent
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: backend:50051
      AGENT_HOSTNAME: edge-server-03
    mem_limit: 256m
    cpus: 0.25
  
  # ─────────────────────────────────────────────
  # Grafana — dashboards and historical metric views
  # ─────────────────────────────────────────────
  grafana:
    container_name: monitoring-grafana
    image: grafana/grafana:12.3.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana


  # ─────────────────────────────────────────────
  # Supabase Studio — optional web UI for inspecting the DB.
  # Disabled by default to keep the stack lean. Uncomment + add the
  # `meta` service if you want to browse data visually.
  # ─────────────────────────────────────────────
  # studio:
  #   container_name: supabase-studio
  #   image: supabase/studio:2026.06.03-sha-0bca601
  #   restart: unless-stopped
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   ports:
  #     - "${STUDIO_PORT:-3000}:3000"
  #   environment:
  #     STUDIO_PG_META_URL: http://meta:8080
  #     SUPABASE_URL: http://kong:8000
  #     SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:-http://localhost:8000}
  #     SUPABASE_ANON_KEY: ${ANON_KEY}
  #     SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}

volumes:
  db_data:
  db_config:
  grafana_data:
